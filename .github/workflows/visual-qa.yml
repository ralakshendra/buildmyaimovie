name: Build My AI Movie Visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload failure screenshots (requires available Actions storage)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify resource library is current
        run: |
          npm run build
          npm run qa:generated

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 scripts/serve-preview.py --port 4173 >/tmp/bmai-server.log 2>&1 &
          echo $! > /tmp/bmai-server.pid
          sleep 2

      - name: Run visual QA
        env:
          BMAI_BASE_URL: http://127.0.0.1:4173/
        run: npm run qa:visual

      - name: Check all public pages and viewports
        env:
          BMAI_BASE_URL: http://127.0.0.1:4173/
        run: npm run qa:cohesion && npm run qa:release && npm run qa:review && npm run qa:student && npm run qa:audit && npm run qa:resource-links && npm run qa:numbering

      - name: Upload screenshots and report
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-my-ai-movie-visual-qa
          path: |
            qa/artifacts/
            qa/report/
            test-results/
            /tmp/bmai-server.log
          if-no-files-found: ignore
          retention-days: 1
